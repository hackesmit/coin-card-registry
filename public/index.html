<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coin &amp; Card Registry</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🪙</span>
      <div>
        <h1>Coin &amp; Card Registry</h1>
        <p class="tagline" id="mode-note">Real eBay sold prices, filtered by grade.</p>
      </div>
    </div>
    <div class="totals" id="totals">
      <div class="total"><span class="total-label">Items</span><span class="total-val" id="t-count">0</span></div>
      <div class="total"><span class="total-label">Paid</span><span class="total-val" id="t-paid">—</span></div>
      <div class="total"><span class="total-label">Est. value</span><span class="total-val" id="t-value">—</span></div>
      <div class="total"><span class="total-label">Gain / loss</span><span class="total-val" id="t-gain">—</span></div>
    </div>
  </header>

  <section class="toolbar">
    <button class="btn primary" id="add-btn">+ Add item</button>
    <div class="filters">
      <select id="filter-type" aria-label="Filter by type">
        <option value="all">All types</option>
        <option value="coin">Coins</option>
        <option value="card">Baseball cards</option>
      </select>
      <input type="search" id="search-box" placeholder="Filter by name / grade…" aria-label="Filter collection" />
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="refresh-all-btn" title="Re-price every item from eBay sold listings">↻ Re-price all</button>
    <button class="btn ghost" id="export-btn" title="Download a backup of your collection">Export</button>
    <button class="btn ghost" id="import-btn" title="Restore from a backup file">Import</button>
    <input type="file" id="import-file" accept="application/json" hidden />
  </section>

  <main>
    <div class="table-wrap">
      <table id="collection">
        <thead>
          <tr>
            <th data-sort="type">Type</th>
            <th data-sort="title">Item</th>
            <th data-sort="grade">Grade</th>
            <th data-sort="pricePaid" class="num">Paid</th>
            <th data-sort="value" class="num">Est. value</th>
            <th data-sort="gain" class="num">Gain / loss</th>
            <th data-sort="updated">Updated</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty-state" hidden>
      <p>No items yet.</p>
      <button class="btn primary" id="empty-add-btn">Add your first coin or card</button>
    </div>
  </main>

  <!-- Add / edit modal -->
  <dialog id="item-dialog">
    <form method="dialog" id="item-form">
      <h2 id="dialog-title">Add item</h2>
      <input type="hidden" id="f-id" />
      <div class="grid">
        <label>Type
          <select id="f-type" required>
            <option value="coin">Coin</option>
            <option value="card">Baseball card</option>
          </select>
        </label>
        <label>Grade / condition
          <input id="f-grade" placeholder="e.g. PCGS MS65, PSA 8, VF, raw" />
        </label>
        <label class="span2">Search terms <span class="hint">— how you'd search it on eBay</span>
          <input id="f-title" required placeholder="e.g. 1968 Mexico 25 centavos" />
        </label>
        <label>Price paid
          <input id="f-paid" type="number" step="0.01" min="0" placeholder="0.00" />
        </label>
        <label>Currency
          <select id="f-currency">
            <option>USD</option><option>EUR</option><option>GBP</option>
            <option>MXN</option><option>CAD</option><option>AUD</option>
          </select>
        </label>
        <label>Date bought
          <input id="f-date" type="date" />
        </label>
        <label>eBay marketplace <span class="hint">— where to price it</span>
          <select id="f-site">
            <option value="ebay.com">ebay.com (USD)</option>
            <option value="ebay.co.uk">ebay.co.uk</option>
            <option value="ebay.de">ebay.de</option>
            <option value="ebay.es">ebay.es</option>
            <option value="ebay.fr">ebay.fr</option>
            <option value="ebay.it">ebay.it</option>
            <option value="ebay.ca">ebay.ca</option>
            <option value="ebay.com.au">ebay.com.au</option>
          </select>
        </label>
        <label class="span2">Where bought / notes
          <input id="f-notes" placeholder="Coin show, flea market, seller name…" />
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn primary" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Item detail modal -->
  <dialog id="detail-dialog">
    <div id="detail-body"><!-- filled by JS --></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
